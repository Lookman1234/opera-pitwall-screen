# Plain-language header: re-runs the synthetic-pit tests every time the code changes.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy pandas matplotlib pyyaml
      - run: python tests/run_tests.py
