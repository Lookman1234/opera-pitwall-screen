# Pilot sites.
# Plain-language header: one entry per pit. The pipeline refuses to run any site
# whose operator matches exclude_operators, so employer pits cannot slip in.
# Defaults chosen 2026-10-11 (author said "go with recommended defaults"): two US
# open pits with a dated, publicly documented wall failure inside the OPERA record.

# Exclusions are kept private: config/exclude.local.yaml (not published) and the
# PITWALL_EXCLUDE secret on GitHub. Public entries may also be listed here.
exclude_operators: []

sites:
  - id: continental
    name: "Continental Pit, Butte, Montana"
    operator: "Montana Resources"
    state: MT
    msha_mine_id: ""            # [VERIFY MSHA mine ID if MSHA records are used]
    # Pit centre 46.0106 N, 112.4800 W (mindat loc-107252); box about 7 km x 7 km
    bbox: [-112.525, 45.980, -112.435, 46.040]
    frame_ids: []
    pit_center: [-112.4800, 46.0106]   # lon, lat (mindat loc-107252) [VERIFY on the auto-walls preview]
    pit_radius_m: 1300                 # keeps the flooded Berkeley Pit (about 2.5 km west) out
    wall_aliases: {D_East: faces_W_E}  # the D East highwall = east side of the pit, facing west
    walls: config/sites/continental_walls.geojson   # optional hand-drawn override; else automatic
    stable: config/sites/continental_stable.geojson
    end_date: "2023-06-30"
    enabled: true
  - id: baldmountain
    name: "Bald Mountain Mine (Saga Pit), White Pine County, Nevada"
    operator: "Kinross Gold"
    state: NV
    msha_mine_id: ""
    # Mine centroid 39.9419 N, 115.5422 W (Wikipedia). The district spans many pits, so this
    # box is wide (about 14 km x 13 km). [VERIFY Saga Pit location, then shrink the box]
    bbox: [-115.622, 39.882, -115.462, 40.002]
    frame_ids: []
    pit_center: null                   # [VERIFY Saga Pit centre, lon/lat]; automatic walls wait for it
    pit_radius_m: 800
    wall_aliases: {Saga_N: faces_S_N}  # the Saga north wall = north side of the pit, facing south
    walls: config/sites/baldmountain_walls.geojson  # optional hand-drawn override; else automatic
    stable: config/sites/baldmountain_stable.geojson
    end_date: "2023-06-30"
    enabled: true
